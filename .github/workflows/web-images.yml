# ย่อรูปชิ้นส่วนตัวละครอัตโนมัติ: อัปรูป 5000px ใน images/ เข้า main → สร้าง/อัปเดตสำเนา 2048px ใน images/web/
name: Make web images
on:
  push:
    branches: [main]
    paths: ['images/*.png', 'images/*.PNG', 'scripts/make_web_images.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: web-images
  cancel-in-progress: false
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Resize
        run: |
          CHANGED=""
          if [ "${{ github.event_name }}" = "push" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'images/*.png' 'images/*.PNG' | tr '\n' ' ')
          fi
          python3 scripts/make_web_images.py $CHANGED
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/web
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update web image copies (auto)"
          git pull --rebase origin main
          git push origin HEAD:main
